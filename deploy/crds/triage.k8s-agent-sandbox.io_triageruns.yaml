  name: triageruns.triage.k8s-agent-sandbox.io
spec:
  group: triage.k8s-agent-sandbox.io
  names:
    kind: TriageRun
    listKind: TriageRunList
    plural: triageruns
    shortNames:
    - tr
    singular: triagerun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.incident
      name: Incident
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sandbox
      name: Sandbox
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TriageRun is one sandboxed triage of an incident's alert.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TriageRunSpec is written only by the coordinator.
            properties:
              alert:
                description: Alert is the SigNoz alert that started an incident.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                  fingerprint:
                    description: Fingerprint identifies the alert across notifications.
                    type: string
                  generatorURL:
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                  startsAt:
                    format: date-time
