# Egress limits for the triage components. Each pod may reach only what it needs.
# The Kubernetes API server rule is generated by setup.sh (it needs the API
# server's IPs) and applied as NetworkPolicy "allow-kube-apiserver" in mcp-gateway
# and alert-triage.
---
# signoz-mcp: DNS, the SigNoz API, and the SigNoz collector (its own telemetry).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: signoz-mcp-egress
  namespace: mcp-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: signoz-mcp
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signoz
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 4317 }
---
# k8s-mcp: DNS only here; the API server comes from allow-kube-apiserver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-mcp-egress
  namespace: mcp-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-mcp
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# triage-controller: DNS, the egress gateway (Slack), and the local Slack stand-in;
# the API server comes from allow-kube-apiserver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triage-controller-egress
  namespace: alert-triage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triage-controller
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-gateway
      ports:
        - { protocol: TCP, port: 3128 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: slack-sink
      ports:
        - { protocol: TCP, port: 8080 }
