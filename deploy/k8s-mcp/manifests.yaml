# Read-only Kubernetes MCP server for the triage agent:
# http://k8s-mcp.mcp-gateway.svc.cluster.local:8080/mcp
#
# Guardrails, strongest first:
#   1. RBAC: get/list/watch only, and no Secrets or ConfigMaps (the ClusterRole below).
#   2. read_only + enabled_tools: only these read tools are registered.
#   3. denied_resources: the server's client also refuses Secrets and ConfigMaps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp
  namespace: mcp-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: triage-k8s-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, namespaces, services, endpoints, persistentvolumeclaims,
                persistentvolumes, replicationcontrollers, resourcequotas, limitranges, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triage-k8s-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: triage-k8s-readonly
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: mcp-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-mcp-config
  namespace: mcp-gateway
data:
  config.toml: |
    port = "8080"
    metrics_port = "8081"
    stateless = true
    read_only = true
    cluster_provider_strategy = "in-cluster"
    list_output = "table"
    toolsets = ["core"]
    enabled_tools = [
      "events_list", "namespaces_list",
      "pods_list", "pods_list_in_namespace", "pods_get", "pods_log",
      "resources_list", "resources_get",
    ]

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "ConfigMap"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: k8s-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-mcp
      annotations:
        triage.agent-sandbox/config-version: "1" # bump to roll pods after config changes
    spec:
      serviceAccountName: k8s-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-mcp
          image: quay.io/containers/kubernetes_mcp_server:v0.1.3@sha256:6347155616c49c78512114500688b50d275ddde7597b6a38cefe6f40a8c42c16
          args: ["--config", "/etc/kubernetes-mcp-server/config.toml"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: k8s-mcp-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-mcp
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: k8s-mcp
spec:
  selector:
    app.kubernetes.io/name: k8s-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
