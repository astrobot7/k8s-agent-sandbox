# SigNoz MCP server in HTTP mode. The triage agent reaches it at
# http://signoz-mcp.mcp-gateway.svc.cluster.local:8000/mcp.
# The Secret signoz-api-key (key SIGNOZ_API_KEY) is created by `./setup.sh signoz-apikey`
# from a SigNoz service account that has only the signoz-viewer role.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signoz-mcp
  namespace: mcp-gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-mcp
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: signoz-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signoz-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-mcp
    spec:
      serviceAccountName: signoz-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signoz-mcp
          image: signoz/signoz-mcp-server:v0.19.0@sha256:c3f632594e40610090d21593a75a59ea61132ca48d049374cce04de60aff9567
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TRANSPORT_MODE
              value: http
            - name: MCP_SERVER_PORT
              value: "8000"
            - name: SIGNOZ_URL
              value: http://main-signoz.signoz.svc.cluster.local:8080
            - name: SIGNOZ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: signoz-api-key
                  key: SIGNOZ_API_KEY
            # Serve the embedded docs index only; no scheduled fetches from signoz.io.
            - name: SIGNOZ_DOCS_REFRESH_INTERVAL
              value: "0"
            - name: SIGNOZ_DOCS_FULL_REFRESH_INTERVAL
              value: "0"
            - name: ANALYTICS_ENABLED
              value: "false"
            # The MCP server's own traces and metrics go to SigNoz.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://main-ingester.signoz.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: signoz-mcp
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=alert-triage,deployment.environment=dev
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-mcp
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: signoz-mcp
spec:
  selector:
    app.kubernetes.io/name: signoz-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
